<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Pro</title>
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .day-done { background-color: #9333ea !important; color: white !important; }
        .nav-btn { transition: all 0.2s; }
        #toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 100;
            max-width: 90%;
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
            text-align: center;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #toast.toast-success { background-color: #16a34a; color: white; }
        #toast.toast-error { background-color: #dc2626; color: white; }
        #toast.toast-warning { background-color: #d97706; color: white; }
        #toast.toast-info { background-color: #7e22ce; color: white; }
        .lottie-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #9ca3af;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body class="pb-24 bg-gray-100 font-sans">

    <!-- TOAST NOTIFICATION -->
    <div id="toast"></div>

    <!-- TRACKER PAGE -->
    <div id="page-tracker" class="tab-content active p-6 max-w-md mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-extrabold text-gray-800">Workout Pro</h1>
        </header>

        <section class="text-center bg-purple-100 p-6 rounded-3xl mb-6 shadow-inner relative">
            <div class="flex items-center justify-center gap-6 mb-4">
                <button id="btn-minus5" class="w-12 h-12 bg-white rounded-full shadow-md font-bold text-lg">-5s</button>
                <button id="btn-duration-toggle" class="w-24 focus:outline-none">
                    <div id="timer" class="text-5xl font-mono font-bold text-purple-700">60</div>
                    <span class="text-[10px] text-purple-500 uppercase font-bold tracking-wider">Tap to edit</span>
                </button>
                <button id="btn-plus5" class="w-12 h-12 bg-white rounded-full shadow-md font-bold text-lg">+5s</button>
            </div>

            <div id="duration-menu" class="hidden absolute top-24 left-4 right-4 bg-white p-4 rounded-2xl shadow-xl z-20">
                <div class="grid grid-cols-3 gap-2">
                    <button data-duration="1" class="btn-duration-preset p-2 bg-purple-50 hover:bg-purple-100 rounded-lg text-sm font-bold">1m</button>
                    <button data-duration="5" class="btn-duration-preset p-2 bg-purple-50 hover:bg-purple-100 rounded-lg text-sm font-bold">5m</button>
                    <button data-duration="10" class="btn-duration-preset p-2 bg-purple-50 hover:bg-purple-100 rounded-lg text-sm font-bold">10m</button>
                </div>
            </div>
            
            <div class="flex gap-4 justify-center">
                <button id="startBtn" class="flex-1 py-3 bg-purple-600 text-white rounded-2xl font-bold shadow-md">Start</button>
                <button id="btn-save-workout" class="flex-1 py-3 bg-green-500 text-white rounded-2xl font-bold shadow-md">Save</button>
                <button id="btn-reset-timer" class="flex-1 py-3 bg-red-500 text-white rounded-2xl font-bold shadow-md">Reset</button>
            </div>
        </section>

        <h1 id="exercise-title" class="text-2xl font-bold mb-4 text-center">Plank</h1>
        <!-- Lottie Animation Players -->
        <div class="w-full aspect-square bg-white rounded-3xl mb-6 shadow-sm p-4 overflow-hidden">
            <lottie-player id="plank-view" src="animations/T Plank Exercise.json" loop autoplay class="w-full h-full"></lottie-player>
            <lottie-player id="pushup-view" src="animations/Push Ups.json" loop autoplay class="w-full h-full hidden"></lottie-player>
            <div id="plank-view-fallback" class="lottie-fallback hidden">Plank animation unavailable</div>
            <div id="pushup-view-fallback" class="lottie-fallback hidden">Push-ups animation unavailable</div>
        </div>

        <div class="flex gap-4">
            <button id="btn-plank" class="flex-1 py-3 bg-purple-600 text-white rounded-2xl font-bold">Plank</button>
            <button id="btn-pushup" class="flex-1 py-3 bg-gray-200 text-gray-700 rounded-2xl font-bold">Push-ups</button>
        </div>
    </div>

    <!-- CALENDAR PAGE -->
    <div id="page-calendar" class="tab-content p-6 max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6">
            <button id="btn-cal-prev" class="p-2 bg-white rounded-lg shadow-sm font-bold hover:bg-gray-200">Prev</button>
            <h1 id="month-name" class="text-xl font-bold"></h1>
            <button id="btn-cal-next" class="p-2 bg-white rounded-lg shadow-sm font-bold hover:bg-gray-200">Next</button>
        </header>
        <div class="grid grid-cols-7 gap-2 text-center mb-2 text-xs font-bold text-gray-400">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div class="bg-white p-4 rounded-3xl shadow-md grid grid-cols-7 gap-2 text-center" id="calendar"></div>
        <div class="mt-6 p-4 bg-white rounded-2xl shadow-sm border border-purple-100">
            <div class="flex justify-between items-center mb-2">
                <h3 class="font-bold text-gray-700">Details</h3>
                <button id="clear-day-btn" class="hidden text-xs bg-red-100 text-red-600 px-3 py-1 rounded font-bold">Discard</button>
            </div>
            <div id="log-list" class="text-sm text-gray-600">Select a date.</div>
        </div>
    </div>

    <!-- HISTORY PAGE -->
    <div id="page-history" class="tab-content p-6 max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-6">Your Progress</h1>
        <div class="bg-white p-6 rounded-3xl shadow-md text-center">
            <div id="stats-total" class="text-5xl font-bold text-purple-600 mb-2">0</div>
            <p class="text-gray-500 font-bold">Total Sessions</p>
            <div id="stats-details" class="mt-6 text-sm font-bold text-gray-700 p-4 bg-gray-50 rounded-xl"></div>
        </div>

        <div class="grid grid-cols-3 gap-3 mt-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm text-center">
                <div id="stats-current-streak" class="text-2xl font-bold text-purple-600">0</div>
                <p class="text-[11px] text-gray-500 font-bold uppercase tracking-wide mt-1">Current<br>Streak</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm text-center">
                <div id="stats-longest-streak" class="text-2xl font-bold text-purple-600">0</div>
                <p class="text-[11px] text-gray-500 font-bold uppercase tracking-wide mt-1">Longest<br>Streak</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm text-center">
                <div id="stats-weekly-rate" class="text-2xl font-bold text-purple-600">0%</div>
                <p class="text-[11px] text-gray-500 font-bold uppercase tracking-wide mt-1">Last 7<br>Days</p>
            </div>
        </div>

        <button id="btn-reset-data" class="mt-8 w-full py-3 bg-red-100 text-red-600 rounded-2xl font-bold text-sm hover:bg-red-200">Reset Data</button>

        <div class="mt-4 flex gap-3">
            <button id="btn-export" class="flex-1 py-3 bg-purple-100 text-purple-700 rounded-2xl font-bold text-sm hover:bg-purple-200">Export Backup</button>
            <button id="btn-import-trigger" class="flex-1 py-3 bg-purple-100 text-purple-700 rounded-2xl font-bold text-sm hover:bg-purple-200">Import Backup</button>
        </div>
        <input type="file" id="import-file-input" accept="application/json" class="hidden">
    </div>

    <!-- MODAL -->
    <div id="log-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-3xl w-full max-w-sm shadow-2xl">
            <h2 class="font-bold text-lg mb-4 text-purple-800" id="modal-date">Log</h2>
            <select id="modal-ex" class="w-full p-3 mb-2 border rounded-xl bg-gray-50"><option>Plank</option><option>Push-ups</option></select>
            <input type="number" id="modal-count" placeholder="Reps / Seconds" class="w-full p-3 mb-2 border rounded-xl">
            <input type="text" id="modal-time" placeholder="Time Taken (e.g. 5m)" class="w-full p-3 mb-4 border rounded-xl">
            <div class="flex gap-2">
                <button id="btn-modal-save" class="flex-1 bg-purple-600 text-white p-3 rounded-xl font-bold">Save</button>
                <button id="btn-modal-cancel" class="flex-1 bg-gray-200 p-3 rounded-xl font-bold">Cancel</button>
            </div>
        </div>
    </div>

    <!-- NAVIGATION -->
    <nav class="fixed bottom-0 w-full bg-white border-t p-4 flex justify-around z-40 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
        <button id="nav-tracker" class="nav-btn font-bold text-purple-600 p-2">Tracker</button>
        <button id="nav-calendar" class="nav-btn font-bold p-2">Calendar</button>
        <button id="nav-history" class="nav-btn font-bold p-2">History</button>
    </nav>

     <script>
        let toastTimeoutId = null;
        function showToast(message, type = 'success', duration = 2600) {
            const toast = document.getElementById('toast');
            clearTimeout(toastTimeoutId);
            toast.className = `toast-${type}`;
            toast.innerText = message;
            // Force reflow so the transition re-triggers even if a toast is already showing
            void toast.offsetWidth;
            toast.classList.add('show');
            toastTimeoutId = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        let currentMonth = new Date();
        currentMonth.setDate(1); // pin to the 1st so month math never overflows (e.g. Jan 31 + 1 month skipping Feb)
        let completedDays = {};
        try {
            completedDays = JSON.parse(localStorage.getItem('plankDays') || '{}');
        } catch (err) {
            console.error('Stored workout data was corrupted, starting fresh:', err);
            completedDays = {};
        }
        let defaultDuration = 60;
        let timeLeft = 60; 
        let timerId = null;
        let selectedDateKey = null;
        let currentExercise = 'plank';

        const TIMER_STATE_KEY = 'plankTimerState';

        function persistTimerState() {
            const state = {
                isRunning: !!timerId,
                timeLeft: timeLeft,
                defaultDuration: defaultDuration,
                currentExercise: currentExercise,
                // If running, store the absolute moment it should hit 0 so we can
                // correctly calculate elapsed time even after a refresh.
                endTime: timerId ? (Date.now() + timeLeft * 1000) : null
            };
            try {
                localStorage.setItem(TIMER_STATE_KEY, JSON.stringify(state));
            } catch (err) {
                console.error('Failed to persist timer state:', err);
            }
        }

        function restoreTimerState() {
            let state;
            try {
                state = JSON.parse(localStorage.getItem(TIMER_STATE_KEY) || 'null');
            } catch (err) {
                console.error('Timer state was corrupted, ignoring:', err);
                return;
            }
            if (!state) return;

            defaultDuration = state.defaultDuration || 60;
            currentExercise = state.currentExercise || 'plank';
            setExercise(currentExercise);

            if (state.isRunning && state.endTime) {
                const remainingMs = state.endTime - Date.now();
                if (remainingMs > 0) {
                    timeLeft = Math.ceil(remainingMs / 1000);
                    updateTimerDisplay();
                    startTimerInterval(); // resume counting down where it left off
                } else {
                    // Timer would have finished while the page was closed/refreshed
                    timeLeft = defaultDuration;
                    updateTimerDisplay();
                }
            } else {
                timeLeft = state.timeLeft || defaultDuration;
                updateTimerDisplay();
            }
        }

        // --- TIMER FUNCTIONS ---
        function updateTimerDisplay() { 
            document.getElementById('timer').innerText = timeLeft; 
        }

        function startTimerInterval() {
            document.getElementById('startBtn').innerText = 'Pause'; 
            timerId = setInterval(() => { 
                timeLeft--; 
                updateTimerDisplay(); 
                persistTimerState();
                if (timeLeft <= 0) stopTimer(); 
            }, 1000); 
        }

        function toggleTimer() { 
            if (timerId) { 
                clearInterval(timerId); 
                timerId = null; 
                document.getElementById('startBtn').innerText = 'Resume'; 
            } else { 
                startTimerInterval();
            } 
            persistTimerState();
        }

        function stopTimer() { 
            clearInterval(timerId); 
            timerId = null; 
            timeLeft = defaultDuration; 
            updateTimerDisplay(); 
            document.getElementById('startBtn').innerText = 'Start'; 
            persistTimerState();
        }

        function adjustTimer(amt) { 
            timeLeft = Math.max(5, timeLeft + amt); 
            defaultDuration = timeLeft;
            updateTimerDisplay(); 
            persistTimerState();
        }

        function setDuration(min) { 
            defaultDuration = min * 60;
            timeLeft = defaultDuration; 
            updateTimerDisplay(); 
            document.getElementById('duration-menu').classList.toggle('hidden'); 
            persistTimerState();
        }

        function toggleDurationMenu() { 
            document.getElementById('duration-menu').classList.toggle('hidden'); 
        }

        // --- EXERCISE SWITCHER ---
        function setExercise(type) {
            document.getElementById('exercise-title').innerText = type === 'plank' ? 'Plank' : 'Push-ups';
            updateLottieVisibility(type);
            document.getElementById('btn-plank').className = type === 'plank' ? "flex-1 py-3 bg-purple-600 text-white rounded-2xl font-bold" : "flex-1 py-3 bg-gray-200 text-gray-700 rounded-2xl font-bold";
            document.getElementById('btn-pushup').className = type === 'pushup' ? "flex-1 py-3 bg-purple-600 text-white rounded-2xl font-bold" : "flex-1 py-3 bg-gray-200 text-gray-700 rounded-2xl font-bold";
            currentExercise = type;
            persistTimerState();
        }

        const lottieLoadFailed = { plank: false, pushup: false };

        function updateLottieVisibility(type) {
            const showPlankAnim = type === 'plank' && !lottieLoadFailed.plank;
            const showPlankFallback = type === 'plank' && lottieLoadFailed.plank;
            const showPushupAnim = type === 'pushup' && !lottieLoadFailed.pushup;
            const showPushupFallback = type === 'pushup' && lottieLoadFailed.pushup;

            document.getElementById('plank-view').classList.toggle('hidden', !showPlankAnim);
            document.getElementById('plank-view-fallback').classList.toggle('hidden', !showPlankFallback);
            document.getElementById('pushup-view').classList.toggle('hidden', !showPushupAnim);
            document.getElementById('pushup-view-fallback').classList.toggle('hidden', !showPushupFallback);
        }

        document.getElementById('plank-view').addEventListener('error', () => {
            lottieLoadFailed.plank = true;
            if (currentExercise === 'plank') updateLottieVisibility('plank');
        });
        document.getElementById('pushup-view').addEventListener('error', () => {
            lottieLoadFailed.pushup = true;
            if (currentExercise === 'pushup') updateLottieVisibility('pushup');
        });

        // --- LOGGING & CALENDARPersist FUNCTIONS ---
        function saveCompletedDays() {
            try {
                localStorage.setItem('plankDays', JSON.stringify(completedDays));
                return true;
            } catch (err) {
                console.error('Failed to save workout data:', err);
                showToast("Couldn't save your data (storage may be full or disabled).", 'error', 4000);
                return false;
            }
        }

        function addLog(dateKey, exercise, count, timeTaken) {
            let logs = completedDays[dateKey] || [];
            logs.push({ exercise, count, timeTaken, loggedAt: new Date().toISOString() });
            completedDays[dateKey] = logs;
            saveCompletedDays();
            renderCalendar(); 
            showDetailsForDate(dateKey);
        }

        function showDetailsForDate(dateKey) {
            selectedDateKey = dateKey;
            const logs = completedDays[dateKey] || [];
            const list = document.getElementById('log-list');
            const clearBtn = document.getElementById('clear-day-btn');
            
            if (logs.length > 0) {
                list.innerHTML = logs.map((l, idx) => `
                    <div class="py-1 border-b flex justify-between items-center">
                        <div><span class="font-bold">${l.exercise}:</span> ${l.count}</div>
                        <div class="flex items-center gap-2">
                            <span class="text-gray-400 text-xs italic">${l.timeTaken}</span>
                            <button data-delete-idx="${idx}" data-date-key="${dateKey}" class="delete-entry-btn text-red-400 hover:text-red-600 text-xs font-bold px-1" title="Delete this entry" aria-label="Delete this entry">✕</button>
                        </div>
                    </div>`).join('');
                clearBtn.classList.remove('hidden');
            } else { 
                list.innerHTML = "No logs yet."; 
                clearBtn.classList.add('hidden'); 
            }
        }

        function deleteLogEntry(dateKey, idx) {
            const logs = completedDays[dateKey] || [];
            if (idx < 0 || idx >= logs.length) return;
            if (!confirm(`Delete the "${logs[idx].exercise}" entry for this day?`)) return;

            logs.splice(idx, 1);
            if (logs.length > 0) {
                completedDays[dateKey] = logs;
            } else {
                delete completedDays[dateKey]; // no entries left, remove the day entirely
            }
            saveCompletedDays();
            renderCalendar();
            showDetailsForDate(dateKey);
        }

        function formatDateKey(year, month, day) {
            // month is 0-indexed; returns YYYY-MM-DD
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        function renderCalendar() {
            const cal = document.getElementById('calendar'); 
            cal.innerHTML = '';
            document.getElementById('month-name').innerText = currentMonth.toLocaleDateString('default', { month: 'long', year: 'numeric' });
            
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstWeekday = new Date(year, month, 1).getDay(); // 0 = Sunday

            const today = new Date();
            const todayKey = formatDateKey(today.getFullYear(), today.getMonth(), today.getDate());

            // Leading blank cells so day 1 lines up under its real weekday
            for (let i = 0; i < firstWeekday; i++) {
                const blank = document.createElement('div');
                cal.appendChild(blank);
            }
            
            for (let i = 1; i <= daysInMonth; i++) {
                const dateKey = formatDateKey(year, month, i);
                
                const logs = completedDays[dateKey] || [];
                const isToday = dateKey === todayKey;
                const isSelected = dateKey === selectedDateKey;

                let classes = 'p-2 border border-gray-200 rounded-lg cursor-pointer hover:border-purple-300 ';
                classes += logs.length > 0 ? 'day-done ' : 'bg-gray-50 ';
                if (isToday) classes += 'ring-2 ring-offset-1 ring-purple-400 ';
                if (isSelected) classes += 'outline outline-2 outline-purple-700 ';

                const d = document.createElement('div');
                d.className = classes.trim();
                d.dataset.dateKey = dateKey;
                d.innerHTML = `<span>${i}</span>`;
                cal.appendChild(d);
            }
        }

        function openLogModalForDate(dateKey) {
            const [y, m, day] = dateKey.split('-').map(Number);
            const label = new Date(y, m - 1, day).toLocaleDateString('default', { month: 'short', day: 'numeric' });

            selectedDateKey = dateKey;
            document.getElementById('modal-date').innerText = `Logging for ${label}`;
            document.getElementById('log-modal').dataset.date = dateKey;
            // Reset the form so a previous day's typed values never carry over
            document.getElementById('modal-ex').selectedIndex = 0;
            document.getElementById('modal-count').value = '';
            document.getElementById('modal-time').value = '';
            document.getElementById('log-modal').classList.remove('hidden');
            showDetailsForDate(dateKey);
            renderCalendar(); // re-render so the selected outline shows immediately
        }

        function changeMonth(delta) { 
            currentMonth.setMonth(currentMonth.getMonth() + delta); 
            renderCalendar(); 
        }

        function switchTab(t) { 
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active')); 
            document.getElementById('page-' + t).classList.add('active'); 
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.toggle('text-purple-600', btn.innerText.toLowerCase() === t)); 
        }

        function saveWorkout() { 
            const now = new Date();
            const todayKey = formatDateKey(now.getFullYear(), now.getMonth(), now.getDate());

            addLog(todayKey, document.getElementById('exercise-title').innerText, `${timeLeft}s`, "Timer"); 
            showToast("Saved to Calendar!"); 
            stopTimer(); 
        }

        function saveManualEntry() { 
            const dateKey = document.getElementById('log-modal').dataset.date;
            const exercise = document.getElementById('modal-ex').value;
            const count = document.getElementById('modal-count').value.trim();
            const timeTaken = document.getElementById('modal-time').value.trim();

            if (!count || !timeTaken) {
                showToast("Please fill in both Reps/Seconds and Time Taken.", 'warning');
                return;
            }

            addLog(dateKey, exercise, count, timeTaken); 
            document.getElementById('modal-ex').selectedIndex = 0;
            document.getElementById('modal-count').value = '';
            document.getElementById('modal-time').value = '';
            document.getElementById('log-modal').classList.add('hidden'); 
        }

        function clearSelectedDay() { 
            if (!selectedDateKey) return;
            if (confirm("Discard all entries for this day?")) { 
                delete completedDays[selectedDateKey]; 
                saveCompletedDays(); 
                renderCalendar(); 
                showDetailsForDate(selectedDateKey); 
            } 
        }

        function exportData() {
            const payload = {
                app: 'WorkoutPro',
                exportedAt: new Date().toISOString(),
                data: completedDays
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const stamp = formatDateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
            a.href = url;
            a.download = `workout-pro-backup-${stamp}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast("Backup downloaded!");
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                let parsed;
                try {
                    parsed = JSON.parse(e.target.result);
                } catch (err) {
                    showToast("That file isn't valid JSON. Import cancelled.", 'error', 3500);
                    event.target.value = '';
                    return;
                }

                // Accept either the exported {app, data} wrapper or a raw completedDays object
                const incoming = (parsed && typeof parsed === 'object' && parsed.data) ? parsed.data : parsed;

                if (!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) {
                    showToast("This doesn't look like a valid Workout Pro backup file.", 'error', 3500);
                    event.target.value = '';
                    return;
                }

                const mode = confirm(
                    "Click OK to MERGE this backup with your current data (adds missing days, keeps existing).\n" +
                    "Click Cancel to REPLACE all current data with this backup instead."
                ) ? 'merge' : 'replace';

                if (mode === 'replace') {
                    completedDays = incoming;
                } else {
                    for (const [dateKey, logs] of Object.entries(incoming)) {
                        if (!Array.isArray(logs)) continue;
                        const existing = completedDays[dateKey] || [];
                        completedDays[dateKey] = existing.concat(logs);
                    }
                }

                saveCompletedDays();
                renderCalendar();
                if (selectedDateKey) showDetailsForDate(selectedDateKey);
                showToast("Import complete!");
                event.target.value = '';
            };
            reader.onerror = () => {
                showToast("Couldn't read that file.", 'error', 3500);
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function dateKeyFromDate(d) {
            return formatDateKey(d.getFullYear(), d.getMonth(), d.getDate());
        }

        function addDays(date, n) {
            const d = new Date(date);
            d.setDate(d.getDate() + n);
            return d;
        }

        function dayHasLog(dateKey) {
            return !!(completedDays[dateKey] && completedDays[dateKey].length > 0);
        }

        function computeStreaks() {
            // Longest streak: scan all logged days in chronological order,
            // tracking the longest run of consecutive calendar days.
            const loggedKeys = Object.keys(completedDays)
                .filter(k => completedDays[k] && completedDays[k].length > 0)
                .sort();

            let longest = 0;
            let run = 0;
            let prevDate = null;
            for (const key of loggedKeys) {
                const d = new Date(key + 'T00:00:00');
                if (prevDate && (d - prevDate) === 86400000) {
                    run++;
                } else {
                    run = 1;
                }
                longest = Math.max(longest, run);
                prevDate = d;
            }

            // Current streak: count backwards from today. If today has no
            // log yet, start from yesterday instead (today isn't "missed"
            // until the day is actually over).
            let cursor = new Date();
            cursor.setHours(0, 0, 0, 0);
            if (!dayHasLog(dateKeyFromDate(cursor))) {
                cursor = addDays(cursor, -1);
            }
            let current = 0;
            while (dayHasLog(dateKeyFromDate(cursor))) {
                current++;
                cursor = addDays(cursor, -1);
            }

            // Weekly rate: % of the last 7 days (including today) with a log.
            let weekCount = 0;
            for (let i = 0; i < 7; i++) {
                const d = addDays(new Date(), -i);
                if (dayHasLog(dateKeyFromDate(d))) weekCount++;
            }
            const weeklyRate = Math.round((weekCount / 7) * 100);

            return { current, longest, weeklyRate };
        }

        function openHistory() { 
            switchTab('history'); 
            const all = Object.values(completedDays).flat(); 
            document.getElementById('stats-total').innerText = all.length; 
            document.getElementById('stats-details').innerText = `Planks: ${all.filter(e => e.exercise === 'Plank').length} | Push-ups: ${all.filter(e => e.exercise === 'Push-ups').length}`; 

            const streaks = computeStreaks();
            document.getElementById('stats-current-streak').innerText = streaks.current;
            document.getElementById('stats-longest-streak').innerText = streaks.longest;
            document.getElementById('stats-weekly-rate').innerText = `${streaks.weeklyRate}%`;
        }

        function clearData() { 
            if (confirm("Reset everything? This deletes all logged workouts and cannot be undone.")) { 
                try {
                    localStorage.removeItem('plankDays'); 
                } catch (err) {
                    console.error('Failed to clear storage:', err);
                }
                completedDays = {}; 
                renderCalendar(); 
                showToast("All data cleared.", 'info'); 
            } 
        }
        
        function initEventListeners() {
            // Tracker page
            document.getElementById('btn-minus5').addEventListener('click', () => adjustTimer(-5));
            document.getElementById('btn-plus5').addEventListener('click', () => adjustTimer(5));
            document.getElementById('btn-duration-toggle').addEventListener('click', toggleDurationMenu);
            document.querySelectorAll('.btn-duration-preset').forEach(btn => {
                btn.addEventListener('click', () => setDuration(Number(btn.dataset.duration)));
            });
            document.getElementById('startBtn').addEventListener('click', toggleTimer);
            document.getElementById('btn-save-workout').addEventListener('click', saveWorkout);
            document.getElementById('btn-reset-timer').addEventListener('click', stopTimer);
            document.getElementById('btn-plank').addEventListener('click', () => setExercise('plank'));
            document.getElementById('btn-pushup').addEventListener('click', () => setExercise('pushup'));

            // Calendar page
            document.getElementById('btn-cal-prev').addEventListener('click', () => changeMonth(-1));
            document.getElementById('btn-cal-next').addEventListener('click', () => changeMonth(1));
            document.getElementById('clear-day-btn').addEventListener('click', clearSelectedDay);
            // Delegated: calendar days are re-created on every render, so bind once on the container
            document.getElementById('calendar').addEventListener('click', (e) => {
                const cell = e.target.closest('[data-date-key]');
                if (!cell) return;
                openLogModalForDate(cell.dataset.dateKey);
            });
            // Delegated: per-entry delete buttons are re-created on every render
            document.getElementById('log-list').addEventListener('click', (e) => {
                const btn = e.target.closest('.delete-entry-btn');
                if (!btn) return;
                deleteLogEntry(btn.dataset.dateKey, Number(btn.dataset.deleteIdx));
            });

            // History page
            document.getElementById('btn-reset-data').addEventListener('click', clearData);
            document.getElementById('btn-export').addEventListener('click', exportData);
            document.getElementById('btn-import-trigger').addEventListener('click', () => {
                document.getElementById('import-file-input').click();
            });
            document.getElementById('import-file-input').addEventListener('change', importData);

            // Modal
            document.getElementById('btn-modal-save').addEventListener('click', saveManualEntry);
            document.getElementById('btn-modal-cancel').addEventListener('click', () => {
                document.getElementById('log-modal').classList.add('hidden');
            });

            // Navigation
            document.getElementById('nav-tracker').addEventListener('click', () => switchTab('tracker'));
            document.getElementById('nav-calendar').addEventListener('click', () => switchTab('calendar'));
            document.getElementById('nav-history').addEventListener('click', openHistory);
        }

        // Initial calls
        initEventListeners();
        renderCalendar();
        restoreTimerState();
    </script>
</body>
</html>
